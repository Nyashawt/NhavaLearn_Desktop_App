<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NhavaLearn — Presentation</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/quill/quill.snow.css">
<link rel="stylesheet" href="vendor/blot-formatter2/quill-blot-formatter2.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
/* Projector-facing view: ONLY clean lesson content — no editing chrome.
   High contrast + large type for a 300-lumen projector in a bright room.
   Navigation works three ways: teacher's control bar on the laptop,
   arrow keys, and on-screen touch arrows (the OwayBoard is touch-enabled). */
:root {
  --amber: #E8712C; --amber-dark: #C85A1F; --amber-light: #F5AC4D;
  --gold: #F5AC4D; --navy: #2D3F54;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #fff; color: var(--navy);
  display: flex; flex-direction: column;
}
body.idle, body.idle * { cursor: none !important; }
header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--amber) 60%, var(--amber-light) 100%);
  color: #fff; padding: 20px 110px 20px 48px; /* right space reserved for the exit button */
  display: flex; justify-content: space-between; align-items: baseline;
}
header .title { font-size: 30px; font-weight: 800; }
header .pg { font-size: 22px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
div#content.ql-editor {
  flex: 1; overflow-y: auto; padding: 48px 72px;
  font-size: 30px; line-height: 1.6; height: auto;
  font-family: "Segoe UI", system-ui, sans-serif;
}
#content img { max-width: 100%; border-radius: 10px; }
#content video { max-width: 100%; border-radius: 10px; background: #000; }
#content h1 { font-size: 48px; } #content h2 { font-size: 40px; } #content h3 { font-size: 34px; }
#content ul, #content ol { padding-left: 1.2em; }
#content.sim-mode { padding: 0; overflow: hidden; }
.simframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.waiting {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: #94A3B8; font-size: 26px;
}
/* On-screen touch navigation — for driving the lesson from the board itself */
.nav-arrow {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 74px; height: 74px; border-radius: 50%;
  border: none; cursor: pointer; z-index: 10;
  background: rgba(45, 63, 84, .35); color: #fff; font-size: 30px;
  display: grid; place-items: center;
  opacity: 0; transition: opacity .25s ease;
}
.nav-arrow:disabled { opacity: 0 !important; pointer-events: none; }
body:not(.idle) .nav-arrow { opacity: .85; }
.nav-arrow:hover { background: rgba(45, 63, 84, .6); }
#nav-prev { left: 22px; }
#nav-next { right: 22px; }
#nav-exit {
  position: fixed; top: 12px; right: 16px; transform: none;
  width: 52px; height: 52px; font-size: 20px;
  background: rgba(220, 38, 38, .75);
}
#nav-exit:hover { background: rgba(220, 38, 38, .95); }
body:not(.idle) #nav-exit { opacity: .85; }
</style>
</head>
<body>
<header>
  <div class="title" id="page-title"></div>
  <div class="pg" id="page-num"></div>
</header>
<div id="content" class="ql-editor"><div class="waiting">Loading lesson…</div></div>
<button class="nav-arrow" id="nav-prev" aria-label="Previous page">&#10094;</button>
<button class="nav-arrow" id="nav-next" aria-label="Next page">&#10095;</button>
<button class="nav-arrow" id="nav-exit" aria-label="End presentation" title="End presentation">&#10005;</button>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script>
"use strict";
let PAGES = [];
let current = 0;
let MEDIA_BASE = "";

/* Called locally AND by the teacher's window through the Python bridge */
function showPage(i) {
  if (!PAGES.length || i < 0 || i >= PAGES.length) return;
  current = i;
  const p = PAGES[i];
  document.getElementById("page-title").textContent = p.title || "";
  document.getElementById("page-num").textContent = (i + 1) + " / " + PAGES.length;
  const main = document.getElementById("content");
  if (p.page_type === "simulation" && p.sim_path) {
    main.classList.add("sim-mode");
    var simUrl = p.sim_path.toLowerCase().endsWith(".ggb")
      ? MEDIA_BASE.replace(/media\/$/, "ggb/") + encodeURIComponent(p.sim_path)
      : MEDIA_BASE + encodeURIComponent(p.sim_path);
    main.innerHTML = '<iframe class="simframe" src="' + simUrl + '"></iframe>';
    document.getElementById("nav-prev").disabled = (i === 0);
    document.getElementById("nav-next").disabled = (i === PAGES.length - 1);
    if (window.pywebview) window.pywebview.api.present_report(i);
    return;
  }
  main.classList.remove("sim-mode");
  main.innerHTML = p.content_html || "";
  main.querySelectorAll("video[data-filename]").forEach(v => {
    v.setAttribute("controls", "");
    v.src = MEDIA_BASE + encodeURIComponent(v.dataset.filename);
  });
  main.scrollTop = 0;
  renderMathInElement(main, {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "\\(", right: "\\)", display: false },
    ],
    throwOnError: false,
  });
  document.getElementById("nav-prev").disabled = (i === 0);
  document.getElementById("nav-next").disabled = (i === PAGES.length - 1);
  // keep the teacher's control bar in step
  if (window.pywebview) window.pywebview.api.present_report(i);
}

function nav(delta) { showPage(current + delta); }

/* Scroll the content area — called locally (arrow keys / touch) and remotely
   from the teacher's control bar via the Python bridge. */
function scrollContent(direction) {
  var main = document.getElementById("content");
  main.scrollBy({ top: direction * window.innerHeight * 0.7, behavior: "smooth" });
}

document.getElementById("nav-prev").onclick = () => nav(-1);
document.getElementById("nav-next").onclick = () => nav(1);
document.getElementById("nav-exit").onclick = () => window.pywebview.api.present_close_request();

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") nav(1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") nav(-1);
  else if (e.key === "ArrowDown") { e.preventDefault(); scrollContent(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); scrollContent(-1); }
  else if (e.key === "Escape") window.pywebview.api.present_close_request();
});

/* Hide the cursor + arrows after a moment of inactivity; any movement or
   touch brings them back (video controls need a visible pointer). */
let idleTimer = null;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000);
}
["mousemove", "pointerdown", "touchstart"].forEach(ev =>
  document.addEventListener(ev, wake, { passive: true }));
wake();

window.addEventListener("pywebviewready", async () => {
  const mb = await window.pywebview.api.get_media_base();
  MEDIA_BASE = mb.base;
  const r = await window.pywebview.api.get_presentation();
  PAGES = r.pages || [];
  showPage(r.index || 0);
});
</script>
</body>
</html>
